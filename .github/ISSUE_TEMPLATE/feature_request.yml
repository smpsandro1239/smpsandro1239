name: Feature request
description: Suggest an idea for this project
title: "[FEATURE] "
labels: ["enhancement"]
assignees: []
body:
  - type: textarea
    id: problem
    attributes:
      label: O seu pedido de funcionalidade está relacionado com um problema?
      description: Uma descrição clara e concisa do que é o problema. Ex. Eu fico sempre frustrado quando [...]
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Descrição da Solução
      description: Uma descrição clara e concisa do que você quer que aconteça.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas Consideradas
      description: Uma descrição clara e concisa de quaisquer soluções ou recursos alternativos que você considerou.
  - type: textarea
    id: context
    attributes:
      label: Contexto Adicional
      description: Adicione qualquer outro contexto ou screenshots sobre o pedido de funcionalidade aqui.
